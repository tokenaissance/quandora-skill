interface:
  display_name: "Paper Trading"
  short_description: "Run and monitor simulated strategy trading"
  icon_small: "./assets/paper-trading.png"
  icon_large: "./assets/paper-trading.png"
  brand_color: "#F28C00"
  default_prompt: "Use $paper-trading to select an existing eligible source and start a Paper run after confirmation; use $strategy-building if a Strategy must be created or backtested first."

dependencies:
  tools:
    - type: "mcp"
      value: "quandora"
      description: "Quandora Paper Trading connection"
      transport: "streamable_http"
      url: "https://mcp.quandora.ai/quant"
      oauth_resource: "https://mcp.quandora.ai/quant"
