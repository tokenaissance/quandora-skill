interface:
  display_name: "Quandora FastAgent Meta Skill"
  short_description: "Install and connect Quandora's five FastAgent skills on one agent"
  default_prompt: "Use $fastagent-quandora when the agent owner asks to set up Quandora on FastAgent. Confirm the target agent is owned by the caller, then ask the agent to install the five skill folders (skills/factor-mining, skills/factor-analysis, skills/strategy-building, skills/strategy-analysis, skills/paper-trading) from tokenaissance/quandora-plugins into this agent's private skills directory, connect the Quandora MCP server, and hand the owner the authorization step. After a new chat, verify the connection with a read-only Quandora call from the live server tool list. Never handle credentials, never hardcode MCP method names, and route factor/strategy/paper business work to the installed capability skills."
  examples:
    - "帮我把 Quandora 装到这个 agent 上并连接"
    - "Install Quandora's five skills on this agent and verify the MCP connection"
    - "这个 agent 上 Quandora 连不上，检查并重新验证"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "fastagent"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "none"
  trust:
    source_tier: "remote-mcp"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow Quandora MCP metadata only"
    generated_public_claims: "evidence-bound"
  permissions:
    network: "skill install from the declared repository; Quandora MCP only"
    file_write: "agent-scoped skills directory only, via the host skill install flow"
    subprocess: "none required"
    interactive: "owner authorization on the Quandora consent page"
  degradation:
    fastagent: "canonical-source"
gates:
  production:
    - "root SKILL.md is the meta entrypoint"
    - "five capability skill folders present under skills/"
    - "oauth connection owner-only"
    - "verification uses the live server tool list, not hardcoded method names"
